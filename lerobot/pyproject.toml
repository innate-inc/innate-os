[project]
name = "lerobot_robot_mars"
version = "0.1.0"
description = "LeRobot plugin for the Innate MARS mobile manipulator: robot client, passthrough teleoperator, dataset converter"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "lerobot[core_scripts,training]>=0.6.1,<0.7",
    "pyzmq>=26",
    "h5py>=3.10",
    "numpy>=2.0",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
# Policies beyond ACT pull in large libraries; opt in with `uv sync --extra smolvla` etc.
diffusion = ["lerobot[diffusion]>=0.6.1,<0.7"]
smolvla = ["lerobot[smolvla]>=0.6.1,<0.7"]
pi = ["lerobot[pi]>=0.6.1,<0.7"]

[project.scripts]
mars2lerobot = "lerobot_robot_mars.convert:main"

[tool.uv]
# torchcodec only loads against a Homebrew ffmpeg on macOS and otherwise prints a screenful of
# dlopen errors on every run before lerobot falls back to PyAV; PyAV is what runs either way.
override-dependencies = ["torchcodec ; sys_platform != 'darwin'"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_mars"]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["lerobot_robot_mars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
