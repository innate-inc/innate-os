[project]
name = "lerobot_robot_mars"
version = "0.1.0"
description = "LeRobot plugin for the Innate MARS mobile manipulator: robot client, passthrough teleoperator, dataset converter"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "lerobot[dataset]>=0.6.1,<0.7",
    "pyzmq>=26",
    "h5py>=3.10",
    "numpy>=2.0",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
# Everything the lerobot CLIs need (record, resume, viewer, training). uv installs it by default
# through the `workstation` group below; with pip, ask for it: pip install lerobot_robot_mars[workstation]
workstation = ["lerobot[core_scripts,training]>=0.6.1,<0.7"]
# Policies beyond ACT pull in large libraries; opt in with `uv sync --extra smolvla` etc.
diffusion = ["lerobot[diffusion]>=0.6.1,<0.7"]
smolvla = ["lerobot[smolvla]>=0.6.1,<0.7"]
pi = ["lerobot[pi]>=0.6.1,<0.7"]

[project.scripts]
mars2lerobot = "lerobot_robot_mars.convert:main"
mars-push = "lerobot_robot_mars.push:main"

[tool.uv]
# The platforms MARS users have: Apple Silicon, Linux PCs, the Jetson, Windows. Without this the lock
# also lists wheels for musl, 32-bit, PowerPC and Intel Macs, none of which torch ships for.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# torchcodec only loads against a Homebrew ffmpeg on macOS and otherwise prints a screenful of
# dlopen errors on every run before lerobot falls back to PyAV; PyAV is what runs either way.
override-dependencies = ["torchcodec ; sys_platform != 'darwin'"]
# The robot installs only the base (dataset conversion) with `uv sync --no-default-groups`.
default-groups = ["dev", "workstation"]

[dependency-groups]
dev = ["pytest>=8"]
workstation = ["lerobot[core_scripts,training]>=0.6.1,<0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_mars"]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["lerobot_robot_mars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
