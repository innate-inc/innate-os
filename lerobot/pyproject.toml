[project]
name = "lerobot_robot_mars"
version = "0.1.0"
description = "LeRobot plugin for the Innate MARS mobile manipulator: robot client, passthrough teleoperator, dataset converter"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "lerobot[dataset]>=0.6.1,<0.7",
    "pyzmq>=26",
    "h5py>=3.10",
    "numpy>=2.0",
    "opencv-python-headless>=4.9",
]

[project.scripts]
mars2lerobot = "lerobot_robot_mars.convert:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_mars"]

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py312"

[tool.ruff.lint.isort]
known-first-party = ["lerobot_robot_mars"]

[tool.pytest.ini_options]
testpaths = ["tests"]
