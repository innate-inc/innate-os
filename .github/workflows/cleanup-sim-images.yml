name: Cleanup Simulator Images

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be deleted without deleting package versions"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-sim-images
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # SECURITY: deletes ghcr package versions -- schedule/dispatch on this
    # repo only, never any pull_request trigger.
    if: github.repository == 'innate-inc/innate-os' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    env:
      ORG: innate-inc
      # Retention policy (every branch tip publishes images):
      #   - main / buildcache / main's current inputs-<hash>: kept forever
      #   - head of a live branch: kept 30 days
      #   - everything else (superseded mid-branch builds, a branch's
      #     cache-<branch> asset build cache): kept 14 days
      HEAD_OF_BRANCH_DAYS: "30"
      OTHER_DAYS: "14"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        # The launcher already computes every inputs-<hash> to name the images
        # it pulls, so each hash_cmd asks it rather than keeping a copy in ci/.
        include:
          - package: innate-os-sim-deps
            hash_cmd: python3 sim/launcher/config.py sim-image-hash
          - package: innate-os-sim-ros
            hash_cmd: python3 sim/launcher/config.py sim-image-hash
          - package: innate-os-sim-assets
            hash_cmd: python3 sim/launcher/config.py assets-image-hash
          # Pinned like the others: a branch whose sim/viewer tree matches
          # main's republishes inputs-<hash> as a new version whose sha- tags
          # age out of retention. Expiring a BRANCH tree's version is not
          # fatal -- the launcher then builds the bundle itself.
          - package: innate-os-sim-viewer
            hash_cmd: python3 sim/launcher/config.py viewer-image-hash

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Always main, even on workflow_dispatch from another branch: the
          # step below computes MAIN's inputs hash to pin its versions.
          ref: main

      - name: Cleanup old GHCR versions
        shell: bash
        env:
          # Through env, not `${{ }}` interpolated into the script below, so
          # the matrix value is data the shell never reparses as source.
          HASH_CMD: ${{ matrix.hash_cmd }}
        run: |
          set -euo pipefail

          package="${{ matrix.package }}"
          versions_file="$(mktemp)"

          gh api --paginate "/orgs/${ORG}/packages/container/${package}/versions" \
            | jq -s 'add' > "${versions_file}"

          # Tags unique per package: a branch build with main's content hash
          # steals the inputs-<hash> tag from the main-tagged version, so the
          # main hash is pinned explicitly (this run checks out main).
          # Each package is tagged from its OWN inputs hash, so the pin has to
          # come from the matching command or retention deletes the version
          # everyone pulls. Plain word-splitting, no eval: every hash_cmd is a
          # simple argv list, and eval would reparse it as shell source.
          main_inputs_hash="$(${HASH_CMD})"

          # Full heads of all live branches; the policy prefix-matches the
          # sha-<short_sha> tag components against these.
          branch_heads="$(git ls-remote --heads origin | cut -f1 | jq -R . | jq -s .)"

          # Policy lives in ci/sim_image_retention.jq; test with
          # ci/test_sim_image_retention.sh after any change.
          plan="$(jq -f ci/sim_image_retention.jq \
            --argjson heads "${branch_heads}" \
            --arg main_hash "${main_inputs_hash}" \
            --argjson head_days "${HEAD_OF_BRANCH_DAYS}" \
            --argjson other_days "${OTHER_DAYS}" \
            "${versions_file}")"

          echo "Package: ${package}"
          jq -r '"Keeping \(.keep) package versions.",
                 "Deleting \(.delete | length) package versions."' <<<"${plan}"

          # Tolerate individual failures (transient 5xx, rate limits,
          # undeletable versions) so one poison version cannot abandon the
          # rest of the sweep; fail the job at the end if any were skipped.
          failures=0
          while IFS=$'\t' read -r version_id tags; do
            [ -n "${version_id}" ] || continue
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "dry-run delete ${package} version ${version_id}: ${tags}"
            elif echo "delete ${package} version ${version_id}: ${tags}" \
              && ! gh api --method DELETE "/orgs/${ORG}/packages/container/${package}/versions/${version_id}"; then
              echo "::warning::failed to delete ${package} version ${version_id}: ${tags}"
              failures=$((failures + 1))
            fi
          done < <(jq -r '.delete[] | "\(.id)\t\(.tags)"' <<<"${plan}")

          if [[ "${failures}" -gt 0 ]]; then
            echo "${failures} deletions failed"
            exit 1
          fi
