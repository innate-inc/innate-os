name: Cleanup Simulator Images

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be deleted without deleting package versions"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  packages: write

concurrency:
  group: cleanup-sim-images
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      ORG: innate-inc
      KEEP_SHA_TAGS: "20"
      KEEP_INPUTS_TAGS: "20"
      KEEP_ASSET_TAGS: "20"
      KEEP_MANUAL_TAGS: "5"
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        package:
          - innate-os-sim-deps
          - innate-os-sim-ros
          - innate-os-sim-assets

    steps:
      - name: Cleanup old GHCR versions
        shell: bash
        run: |
          set -euo pipefail

          package="${{ matrix.package }}"
          keep_file="$(mktemp)"
          versions_file="$(mktemp)"

          # A package that has never been published is nothing to clean, not an
          # error — every scheduled run used to die here on the 404. Anything
          # else (permissions, rate limit, transient API failure) still fails
          # the job rather than silently skipping cleanup.
          api_error_file="$(mktemp)"
          if ! gh api --paginate "/orgs/${ORG}/packages/container/${package}/versions" \
              > "${versions_file}" 2> "${api_error_file}"; then
            # 404 can also mean a broken token/visibility, not just a
            # never-published package — only treat it as nothing-to-clean when
            # the org's package listing works, i.e. our access is generally
            # intact. Anything else fails the job rather than silently
            # disabling cleanup.
            if grep -q "HTTP 404" "${api_error_file}" \
                && gh api "/orgs/${ORG}/packages?package_type=container" > /dev/null; then
              echo "Package ${package} not found on ghcr; nothing to clean up."
              exit 0
            fi
            cat "${api_error_file}" >&2
            exit 1
          fi

          jq -r '
            .[]
            | select((.metadata.container.tags // []) | any(. == "main" or startswith("buildcache")))
            | .id
          ' "${versions_file}" >> "${keep_file}"

          jq -r --argjson keep "${KEEP_SHA_TAGS}" '
            [
              .[]
              | select((.metadata.container.tags // []) | any(startswith("sha-")))
              | {id, updated_at}
            ]
            | sort_by(.updated_at)
            | reverse
            | .[:$keep][]
            | .id
          ' "${versions_file}" >> "${keep_file}"

          jq -r --argjson keep "${KEEP_INPUTS_TAGS}" '
            [
              .[]
              | select((.metadata.container.tags // []) | any(startswith("inputs-")))
              | {id, updated_at}
            ]
            | sort_by(.updated_at)
            | reverse
            | .[:$keep][]
            | .id
          ' "${versions_file}" >> "${keep_file}"

          jq -r --argjson keep "${KEEP_ASSET_TAGS}" '
            [
              .[]
              | select((.metadata.container.tags // []) | any(startswith("assets-")))
              | {id, updated_at}
            ]
            | sort_by(.updated_at)
            | reverse
            | .[:$keep][]
            | .id
          ' "${versions_file}" >> "${keep_file}"

          jq -r --argjson keep "${KEEP_MANUAL_TAGS}" '
            [
              .[]
              | select((.metadata.container.tags // []) | any(startswith("manual-")))
              | {id, updated_at}
            ]
            | sort_by(.updated_at)
            | reverse
            | .[:$keep][]
            | .id
          ' "${versions_file}" >> "${keep_file}"

          sort -u -o "${keep_file}" "${keep_file}"

          delete_file="$(mktemp)"
          jq -r '.[] | .id' "${versions_file}" \
            | grep -Fvx -f "${keep_file}" \
            > "${delete_file}" || true

          echo "Package: ${package}"
          echo "Keeping $(wc -l < "${keep_file}" | xargs) package versions."
          echo "Deleting $(wc -l < "${delete_file}" | xargs) package versions."

          while IFS= read -r version_id; do
            [ -n "${version_id}" ] || continue
            tags="$(jq -r --argjson id "${version_id}" '
              .[] | select(.id == $id) | (.metadata.container.tags // []) | join(",")
            ' "${versions_file}")"
            # Belt-and-braces (INN-710): whatever the keep-selection above
            # computed, never delete a version carrying a protected tag —
            # CI depends on main/buildcache existing (including the per-arch
            # buildcache-amd64/-arm64 tags ci/build_sim_images.sh pushes).
            case ",${tags}," in
              *,main,*|*,buildcache,*|*,buildcache-*)
                echo "SKIP protected ${package} version ${version_id}: ${tags}"
                continue
                ;;
            esac
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "dry-run delete ${package} version ${version_id}: ${tags}"
            else
              echo "delete ${package} version ${version_id}: ${tags}"
              gh api --method DELETE "/orgs/${ORG}/packages/container/${package}/versions/${version_id}"
            fi
          done < "${delete_file}"
