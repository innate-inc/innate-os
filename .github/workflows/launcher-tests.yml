name: Launcher Tests

# tests/ guards host-side, no-ROS invariants (launcher preflights, image-tag
# hashing, workflow path filters); nothing else in CI runs pytest, so without
# this job the suite only runs when a developer remembers to.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.12 for stdlib tomllib; the launcher itself still supports 3.10+tomli.
          python-version: "3.12"

      - name: Run the host-side test suite
        run: |
          pip install pytest pyyaml numpy trimesh pillow mujoco
          python -m pytest tests/ -q

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Test simulator scene swapping
        working-directory: sim/viewer
        run: |
          npm ci
          npm run test:environment
          npm run typecheck

  bench-tests:
    # The benchmark's own suite. Offline by construction: no API key, no
    # network, no Docker -- so it belongs on every PR rather than in a
    # developer's memory. MUJOCO_GL=osmesa keeps the one world-building test
    # headless.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ubuntu-latest ships libGL but not OSMesa, and with MUJOCO_GL=osmesa
      # PyOpenGL binds to OSMesa at import -- without the library every test
      # that imports the driver fails at collection, before a world is built.
      - name: Install OSMesa
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libosmesa6 libosmesa6-dev

      - name: Run the benchmark test suite
        env:
          MUJOCO_GL: osmesa
        run: |
          pip install pytest mujoco numpy pillow
          python -m pytest sim/bench -q
