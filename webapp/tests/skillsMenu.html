<!doctype html>
<meta charset="utf-8">
<title>Skills menu integration test</title>
<link rel="stylesheet" href="../css/app.css">
<style>body { display: block; padding: 32px; } #test { padding: 8px 12px; border: 1px solid #555; border-radius: 6px; } #launcher { position: fixed; bottom: 32px; right: 32px; } #result { white-space: pre-wrap; }</style>
<button id="test">Run integration test</button>
<pre id="result">Ready</pre>
<div id="launcher"></div>
<script type="module">
import { createSkillsMenu } from '../js/teleop/skillsMenu.js';
import { AVAILABLE_SKILLS_TOPIC } from '../js/constants.js';
const callbacks = new Map();
const goals = [];
const ros = {
  state: 'connected',
  subscribe(topic, callback) { callbacks.set(topic, callback); return () => callbacks.delete(topic); },
  onStateChange() { return () => {}; },
  sendActionGoal(action, type, goal) { goals.push(goal); return { promise: new Promise(() => {}), cancel() {} }; },
};
const roster = [
  { id: 'pick_cup', type: 'learned' },
  { id: 'wave', type: 'replay' },
  { id: 'say_hello', type: 'code', inputs: { text: { type: 'string', required: true } } },
  { id: 'home_pose', type: 'poses' },
  { id: 'custom_skill' },
  { id: 'broken_skill', type: 'code', load_error: 'Could not load skill' },
];
let menu;
function setup() {
  menu?.destroy();
  goals.length = 0;
  menu = createSkillsMenu(document.querySelector('#launcher'), ros);
  callbacks.get(AVAILABLE_SKILLS_TOPIC)({ skills: roster });
  document.querySelector('.skills-menu-btn').click();
}
setup();
const assert = (condition, message) => { if (!condition) throw new Error(message); };
document.querySelector('#test').onclick = (event) => {
  event.stopPropagation();
  try {
    setup();
    const row = id => document.querySelector(`[data-skill-id="${id}"]`);
    const icon = id => row(id).querySelector('.skills-pop-type-icon');
    const legends = [...document.querySelectorAll('.skills-pop-legend-item .skills-pop-type-icon')];
    ['pick_cup', 'wave', 'say_hello'].forEach((id, i) => {
      assert(legends[i].getAttribute('aria-hidden') === 'true', 'legend icon is decorative');
      assert(icon(id).getAttribute('aria-hidden') !== 'true', 'row category remains accessible');
      assert(icon(id).innerHTML === legends[i].innerHTML, `${id}: legend matches`);
      assert(icon(id).getAttribute('aria-label').endsWith('skill'), `${id}: accessible category`);
      assert(icon(id).getBoundingClientRect().width === 16, `${id}: compact size`);
      assert(getComputedStyle(icon(id)).color === getComputedStyle(legends[i]).color, 'legend color matches category');
    });
    assert(new Set(['pick_cup', 'wave', 'say_hello'].map(id => getComputedStyle(icon(id)).color)).size === 3, 'distinct category colors');
    assert(icon('home_pose').innerHTML === icon('pick_cup').innerHTML, 'poses use learned icon');
    assert(icon('custom_skill').querySelector('svg'), 'unknown type fallback');
    assert(document.querySelector('.skills-pop-type-icon.broken').closest('button').disabled, 'failed load cannot run');
    const search = document.querySelector('.skills-pop-search-input');
    search.value = 'say hello';
    search.dispatchEvent(new Event('input'));
    assert(document.querySelectorAll('[data-skill-id]').length === 1, 'search filters');
    row('say_hello').click();
    const input = document.querySelector('.skill-input');
    input.value = 'Hello';
    input.dispatchEvent(new Event('input'));
    input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
    assert(goals.length === 1 && goals[0].skill_type === 'say_hello', 'keyboard launch');
    assert(JSON.parse(goals[0].inputs).text === 'Hello', 'input reaches action');
    assert(!document.querySelector('.skills-menu.open'), 'launch closes popup');
    setup();
    document.querySelector('#result').textContent = 'PASS: category icons, legend, fallback, failed load, search, parameter input, Enter launch and close.';
  } catch (error) {
    document.querySelector('#result').textContent = `FAIL: ${error.stack}`;
  }
};
</script>
