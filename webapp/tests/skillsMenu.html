<html lang="en">
<meta charset="utf-8">
<title>Skills menu enum regression</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { display: block; }
  #result { margin: 24px; white-space: pre-wrap; }
  #fixture { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); }
</style>
<pre id="result">Running…</pre>
<div id="fixture"></div>
<script type="module">
  import { createSkillsMenu } from "../js/teleop/skillsMenu.js";
  import { AVAILABLE_SKILLS_TOPIC, EXECUTE_SKILL_ACTION } from "../js/constants.js";

  const fixture = document.querySelector("#fixture");
  const result = document.querySelector("#result");
  const subscribers = new Map();
  const goals = [];
  createSkillsMenu(fixture, {
    state: "connected",
    subscribe(topic, callback) {
      subscribers.set(topic, callback);
      return () => subscribers.delete(topic);
    },
    onStateChange: () => () => {},
    sendActionGoal(action, type, goal) {
      equal(action, EXECUTE_SKILL_ACTION, "action route");
      goals.push(JSON.parse(goal.inputs));
      return { promise: Promise.resolve({ success: true }), cancel() {} };
    },
  });
  const skill = { id: "enum_regression", name: "Enum regression", inputs: {
    mode: { type: "str", enum: ["a", "b"] },
    count: { type: "int", enum: [1, 0], default: 0 },
    enabled: { type: "bool", enum: [true, false], default: false },
    optional: { type: "str", enum: ["a", "b"] },
    invalid: { type: "str", enum: ["a", "b"], default: "missing" },
    nullable: { type: "str", enum: ["a", "b"], default: null },
    required: { type: "str", enum: ["a", "b"], required: true },
    requiredDefault: { type: "str", enum: ["a", "b"], required: true, default: "b" },
  } };
  const publish = (skills) => subscribers.get(AVAILABLE_SKILLS_TOPIC)({ skills });
  const group = (name) => fixture.querySelector(`[role="radiogroup"][aria-label="${name}"]`);
  const pills = (name) => [...group(name).querySelectorAll("button")];
  const selected = (name) => group(name).querySelector(".on")?.textContent ?? null;
  const openForm = () => fixture.querySelector(".skills-pop-item").click();
  const frame = () => new Promise(requestAnimationFrame);
  function equal(actual, expected, message) {
    if (JSON.stringify(actual) !== JSON.stringify(expected)) {
      throw new Error(`${message}: expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    }
  }
  function press(name, key) {
    group(name).focus();
    const event = new KeyboardEvent("keydown", { key, bubbles: true, cancelable: true });
    group(name).dispatchEvent(event);
    equal(event.defaultPrevented, true, `${key} handled by the form`);
  }

  try {
    publish([skill]);
    fixture.querySelector(".skills-menu-btn").click();
    await frame();
    openForm();
    pills("mode")[0].click(); // Save an explicit unset before a default exists.
    pills("optional")[2].click(); // Keep a real selection across roster reloads.
    skill.inputs.mode.default = "b";
    // Reload the roster while keeping this menu's saved values.
    publish([]);
    publish([skill]);
    openForm();

    for (const [name, labels, value] of [
      ["mode", ["a", "b"], "b"],
      ["count", ["1", "0"], "0"],
      ["enabled", ["true", "false"], "false"],
      ["optional", ["—", "a", "b"], "b"],
      ["invalid", ["—", "a", "b"], null],
      ["nullable", ["—", "a", "b"], null],
      ["required", ["a", "b"], null],
      ["requiredDefault", ["a", "b"], "b"],
    ]) {
      equal(pills(name).map((pill) => pill.textContent), labels, `${name} choices`);
      equal(selected(name), value, `${name} selected`);
    }
    // Invalid defaults still let the user explicitly omit the input.
    pills("invalid")[0].click();
    pills("nullable")[0].click();
    fixture.querySelector(".skill-confirm").click();
    equal(goals.length, 0, "required enum blocks an empty submission");
    equal(fixture.querySelector(".skill-status").textContent, "required: Required", "required feedback");

    for (const [name, next, original] of [["mode", "a", "b"], ["count", "1", "0"], ["enabled", "true", "false"]]) {
      press(name, "ArrowRight");
      equal(selected(name), next, `${name} wraps past the last option`);
      equal(document.activeElement === group(name), true, `${name} keeps keyboard focus`);
      press(name, "ArrowLeft");
      equal(selected(name), original, `${name} wraps back without unset`);
    }
    press("optional", "ArrowRight");
    equal(selected("optional"), "—", "optional enum still cycles through unset");
    press("required", "ArrowLeft");
    equal(selected("required"), "b", "required enum still starts at the last option on left");
    press("mode", "Enter");
    await frame();
    equal(goals, [{ mode: "b", count: 0, enabled: false, required: "b", requiredDefault: "b" }], "typed submission omits unset inputs");
    equal(fixture.querySelector(".skills-menu-btn").getAttribute("aria-expanded"), "false", "Enter closes the menu");
    fixture.querySelector(".skills-menu-btn").click();
    await frame();
    equal(selected("mode"), "b", "default survives reopening");
    equal(selected("optional"), "—", "unset survives reopening when allowed");
    result.textContent = "PASS — enum defaults, saved values, keyboard cycling, required validation, and submitted inputs";
    result.dataset.status = "passed";
  } catch (error) {
    result.textContent = `FAIL — ${error.stack}`;
    result.dataset.status = "failed";
    throw error;
  }
</script>
</html>
