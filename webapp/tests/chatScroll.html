<!doctype html>
<meta charset="utf-8">
<!-- Serve webapp/ over HTTP and open tests/chatScroll.html. PASS/FAIL reports
     real DOM layout and scrolling checks without connecting to a robot. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat scrolling regression checks</title>
<link rel="stylesheet" href="../css/app.css">
<style>
body { display:block; padding: 12px; overflow: auto; }
#fixture { position: relative; width: 360px; max-width: 100%; height: 460px; display:flex; flex-direction:column; padding:16px; background:#333; }
#result { white-space:pre-wrap; }
</style>
<pre id="result">Running…</pre>
<section id="fixture" class="agent-panel agent-thoughts-panel"></section>
<script type="module">
import { createChatStream } from '../js/agent/chatStream.js';
import { createOfferDeck } from '../js/agent/offerDeck.js';
const result = document.querySelector('#result');
const fixture = document.querySelector('#fixture');
const deck = createOfferDeck();
const chat = createChatStream({footer:deck.el});
const composer = document.createElement('textarea');
composer.setAttribute('aria-label','Test composer');
composer.style.flex = '0 0 50px';
composer.className='agent-compose';
const composeArea=document.createElement('div');
composeArea.className='agent-compose-area';
composeArea.append(composer);
fixture.append(chat.wrap,composeArea);
const el=chat.scrollElement;
const thinking=document.createElement('div');
thinking.className='agent-thinking active';
thinking.textContent='Thinking…';
el.append(thinking);
const latest=chat.wrap.querySelector('.agent-chat-latest');
const frame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const checks=[];
const check=(ok,label)=>{ if(!ok) throw new Error(label); checks.push(label); };
const bottom=()=>Math.abs(el.scrollHeight-el.clientHeight-el.scrollTop)<2;
const offers=n=>Array.from({length:n},(_,i)=>({kind:'reply',text:`Suggestion ${i+1}: a longer possible prompt`,onSelect:()=>{}}));
try {
  await frame();
  check(latest.hidden,'No arrow for an empty chat');
  deck.set(offers(12),'Try asking');
  await frame();
  const entries=Array.from({length:20},(_,i)=>({sender:'robot',text:`Message ${i+1}: enough text to fill this small chat panel.`,timestamp:i+1}));
  chat.replay(entries);
  await frame();
  check(bottom(),'Initial history follows latest message and suggestions');
  check(latest.hidden,'No arrow when already at the latest messages');
  const thinkingBottom=thinking.getBoundingClientRect().bottom;
  check(thinkingBottom<=el.getBoundingClientRect().bottom,'Thinking is visible at the end of chat');
  const composerTop=composer.getBoundingClientRect().top;
  check(el.getBoundingClientRect().bottom>=composerTop,'Scroll content extends behind the input instead of stopping above its gap');
  el.scrollTop=0;
  await frame();
  chat.addMessage('robot','New output must not interrupt reading',30);
  await frame();
  check(el.scrollTop<2,'Incoming messages preserve manual scrollback');
  check(thinking.getBoundingClientRect().top>el.getBoundingClientRect().bottom,'Thinking scrolls away instead of covering older messages');
  check(!latest.hidden,'Arrow appears during scrollback, including incoming output');
  deck.set(offers(16),'Try asking');
  await frame();
  check(el.scrollTop<2,'Growing suggestions preserve manual scrollback');
  chat.replay(entries);
  await frame();
  check(el.scrollTop<2 && deck.el.isConnected,'History refresh preserves scrollback and suggestions');
  chat.addMessage('user','Next prompt',31);
  await frame();
  check(bottom(),'Sending returns to the bottom including suggestions');
  fixture.style.height='380px';
  await frame();
  check(bottom(),'Resizing chat keeps the bottom anchored');
  fixture.style.height='460px';
  el.scrollTop=0;
  await frame();
  check(composer.getBoundingClientRect().top===composerTop,'Composer stays fixed while messages and suggestions scroll');
  latest.click();
  await frame();
  check(bottom() && latest.hidden,'Arrow returns to the end of suggestions and disappears');
  chat.addMessage('robot','x'.repeat(500),50);
  await frame();
  check(el.scrollWidth<=el.clientWidth,'Unbroken text does not widen the chat');
  const background=getComputedStyle(composer).backgroundColor;
  check(background!=='transparent' && !background.endsWith(', 0)'), 'Composer obscures content scrolling behind it');
  result.textContent=`PASS: ${checks.length} checks\n`+checks.join('\n');
} catch(e) { result.textContent='FAIL: '+e.message+'\nPassed: '+checks.join('\n'); }
</script>
