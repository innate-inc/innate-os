<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Separate chat suggestions checks</title>
<link rel="stylesheet" href="../css/app.css?split-replies">
<style>body{display:block;padding:14px;background:#4b4b4d}#fixture{position:relative;width:360px;max-width:100%;height:440px;display:flex;flex-direction:column}#result{white-space:pre-wrap}</style>
<section id="fixture" class="agent-panel agent-thoughts-panel agent-compact"></section>
<pre id="result">Running…</pre>
<script type="module">
import {createOfferDeck} from '../js/agent/offerDeck.js?split-replies';
import {createChatStream} from '../js/agent/chatStream.js';
const deck=createOfferDeck({splitReplies:true});
const chat=createChatStream({footer:deck.el});
document.querySelector('#fixture').append(chat.wrap);
const el=chat.scrollElement, checks=[], picked=[];
const check=(ok,label)=>{if(!ok)throw Error(label);checks.push(label)};
const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const grant={kind:'grant',text:'HeadEmotion',detail:'Make a face for what it feels',onSelect:text=>picked.push(text)};
const replies=['Where are you?','What is a skill?'].map(text=>({kind:'reply',text,onSelect:text=>picked.push(text)}));
const [ask, suggestions]=deck.el.children;
try {
deck.set([grant,...replies],'MARS asks for a skill');
await frame();
check(ask.classList.contains('ui-cue') && !suggestions.classList.contains('ui-cue'),'Your move cue belongs only to the skill card');
check(!ask.querySelector('.reply') && suggestions.querySelectorAll('.reply').length===2,'Replies are in a separate card');
check(suggestions.querySelector('.agent-offers-kicker').textContent==='Try askingTry:','Suggestions have their own heading');
check(suggestions.getBoundingClientRect().top>=ask.getBoundingClientRect().bottom+12,'Cards have visible separation');
check(Math.abs(ask.getBoundingClientRect().width-suggestions.getBoundingClientRect().width)<1,'Both cards align');
ask.querySelector('button').click(); suggestions.querySelector('button').click();
check(picked.join('|')==='HeadEmotion|Where are you?','Both kinds retain their actions');
deck.set(replies);
check(ask.hidden && !suggestions.hidden,'Replies alone leave no empty Your move card');
deck.set([grant],'MARS asks for a skill');
check(!ask.hidden && suggestions.hidden,'Skill alone leaves no empty Try asking card');
deck.set([]);
check(deck.el.hidden,'Empty offers hide the whole stack');
for(let i=0;i<12;i++) chat.addMessage('robot','Earlier message '+i, i+1);
deck.set([grant,...Array.from({length:20},(_,i)=>({...replies[0],text:'Suggestion '+i}))],'MARS asks for a skill');
await frame();
check(suggestions.querySelector('.agent-offers-row').scrollWidth>suggestions.querySelector('.agent-offers-row').clientWidth,'Many suggestions scroll in their compact row');
check(Math.abs(el.scrollHeight-el.clientHeight-el.scrollTop)<2,'Growing suggestions follow the bottom');
el.scrollTop=0;
await frame();
chat.addMessage('robot','New output while reading',1);
await frame();
check(el.scrollTop<2,'Incoming output preserves manual scrollback');
chat.wrap.querySelector('.agent-chat-latest').click();
await frame();
check(Math.abs(el.scrollHeight-el.clientHeight-el.scrollTop)<2,'Latest button reaches the end of the separate suggestions');
check(el.scrollWidth<=el.clientWidth,'Separate cards do not cause horizontal scrolling');
deck.set([grant,...replies],'MARS asks for a skill');
document.querySelector('#result').textContent='PASS: '+checks.length+' checks';
} catch(e) {document.querySelector('#result').textContent='FAIL: '+e.message;}
</script>
