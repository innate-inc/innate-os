<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent mobile menu checks</title>
<link rel="stylesheet" href="../css/app.css">
<style>#result {position:fixed;top:90px;left:12px;white-space:pre-wrap;} </style>
<div class="cockpit agent-cockpit agent-compact"><div class="overlay-stack-top-left"><div class="agent-corner-controls"><button class="cam-strip-toggle">Eye</button></div></div></div>
<pre id="result">Running…</pre>
<script type="module">
import {createAgentStudio} from '../js/agent/agentStudio.js';
const root=document.querySelector('.agent-cockpit'), noop=()=>{}, checks=[];
const check=(ok,text)=>{if(!ok)throw Error(text);checks.push(text)};
const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
let studio, createDraft;
try {
const state={currentDirective:'demo',activeSkills:new Set(),agents:[{id:'demo',name:'Demo',prompt:'Hello robot',skills:[],source:'shipped',editable:false}]};
studio=createAgentStudio(root,{get:()=>state,subscribe:()=>noop},null,{setDisplayName:noop,setOffers:noop,setComposerAsk:noop}, {onCreateAgent:cb=>{createDraft=cb;},spokenCount:()=>0,motionAt:()=>0,recalledAt:()=>0,turnedAt:()=>0,lastLine:()=>'',overlay:()=>noop,cancelSkill:async()=>{}});
document.querySelector('.agent-corner-controls').append(studio.mobileToggle);
studio.setCompact(true);
await frame();
const dock=root.querySelector('.agent-studio-dock'), button=studio.mobileToggle;
button.click();
await frame();
check(!dock.hidden && button.getAttribute('aria-expanded')==='true','Dots open the real agent editor');
studio.setCompact(true);
check(!dock.hidden,'Repeated layout updates preserve the open menu');
button.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
check(dock.hidden && (!matchMedia('(max-width:820px)').matches || document.activeElement===button),'Escape closes and returns focus on mobile');
button.click();
document.body.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,composed:true}));
check(dock.hidden,'Outside tap closes the menu');
button.click();
root.querySelector('.agent-studio').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,composed:true}));
check(!dock.hidden,'Interaction within the menu keeps it open');
if(matchMedia('(max-width:820px)').matches) {
const box=root.querySelector('.agent-studio').getBoundingClientRect();
check(box.left>=0 && box.right<=innerWidth,'Menu fits the viewport');
state.agents[0].prompt=('A long prompt that stays readable on a phone.\n').repeat(80);
studio.setCompact(true);
await frame();
const reader=root.querySelector('.agent-studio-mobile-prompt').parentElement;
const headingTop=root.querySelector('.agent-studio-mobile-name').getBoundingClientRect().top;
const tabsTop=root.querySelector('.agent-studio-tabs').getBoundingClientRect().top;
reader.scrollTop=reader.scrollHeight;
check(reader.scrollTop>0,'Long plain prompt scrolls within its pane');
check(root.querySelector('.agent-studio-mobile-name').getBoundingClientRect().top===headingTop && root.querySelector('.agent-studio-tabs').getBoundingClientRect().top===tabsTop,'Name and tabs stay fixed while reading');
check(reader.scrollWidth<=reader.clientWidth,'Long prompt does not widen the menu');
}
// Creating on desktop, then narrowing before naming, must not offer a broken Create.
studio.setCompact(false);
createDraft();
await frame();
const nameInput=root.querySelector('.agent-studio input');
const promptInput=root.querySelector('textarea[aria-label="Agent prompt"]');
const saveButton=root.querySelector('.agent-studio-savebar button');
const cancelButton=[...root.querySelectorAll('.agent-studio-savebar button')].find(e=>e.textContent==='Cancel');
studio.setCompact(true);
button.click();
await frame();
check(saveButton.hidden && !cancelButton.hidden,'Mobile pauses Create but allows cancellation');
saveButton.click();
await frame();
check(!root.querySelector('.agent-studio-status').textContent.includes('Give it a name'),'Stale Create action cannot validate a hidden name field');
studio.setCompact(false);
nameInput.value='My helper';
nameInput.dispatchEvent(new Event('input',{bubbles:true}));
promptInput.value='Keep this unfinished prompt';
promptInput.dispatchEvent(new Event('input',{bubbles:true}));
studio.setCompact(true);
studio.setCompact(false);
check(nameInput.value==='My helper' && promptInput.value==='Keep this unfinished prompt' && !nameInput.readOnly && !saveButton.hidden,'Returning to desktop restores the editable draft');
studio.setCompact(true);
cancelButton.click();
check(root.querySelector('.agent-studio-mobile-name').textContent==='Demo','Mobile cancellation exits the draft');
studio.destroy();
check(!button.isConnected && !dock.isConnected,'Destroy cleans up menu controls');
document.querySelector('#result').textContent='PASS: '+checks.length+' checks';
} catch(e) {document.querySelector('#result').textContent='FAIL: '+e.message; studio?.destroy();}
</script>
