<!doctype html>
<!-- Serve webapp/ locally and open /tests/agentThinking.test.html.
     Runs the real panel and stylesheet against an in-memory ROS feed.
     The heartbeat-expiry check takes 10 seconds; the title reports PASS/FAIL. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking notice test</title>
<link rel="stylesheet" href="../css/app.css">
<style>
  body { display: block; overflow: auto; }
  #result { padding: 12px; }
  #cockpit { position: relative; height: 700px; }
</style>
<p id="result" role="status">Running thinking notice integration test…</p>
<main id="cockpit" class="agent-cockpit"></main>
<script type="module">
  import { createAgentPanel } from "../js/agent/agentPanel.js";
  import { AGENT_STATUS_TOPIC, CHAT_IN_TOPIC, CHAT_OUT_TOPIC } from "../js/constants.js";

  const root = document.querySelector("#cockpit");
  const topics = new Map();
  const connections = new Set();
  const published = [];
  const ros = {
    subscribe(topic, cb) { topics.set(topic, cb); return () => topics.delete(topic); },
    onStateChange(cb) { connections.add(cb); cb("connected"); return () => connections.delete(cb); },
    callService: async () => ({ history: "[]" }),
    publish: (topic, msg) => published.push({ topic, msg }),
  };
  const snapshot = {
    agents: [{ id: "demo", name: "Demo", skills: [] }], broken: [],
    brainActive: true, currentDirective: "demo", activeSkills: new Set(),
  };
  const state = {
    get: () => snapshot,
    subscribe(cb) { cb(snapshot); return () => {}; },
    setDirective: async () => {}, resetBrain: async () => {},
  };
  const panel = createAgentPanel(root, ros, state, {});
  const compact = window.innerWidth <= 640;
  root.classList.toggle("agent-compact", compact);
  panel.setCompact(compact);
  if (compact) root.querySelector(".agent-sheet-grab").click();
  const notice = root.querySelector(".agent-thinking");
  const input = root.querySelector("textarea");
  const stream = root.querySelector(".agent-stream");
  const sendStatus = (status) => topics.get(AGENT_STATUS_TOPIC)({ data: JSON.stringify(status) });
  const thinking = () => sendStatus({ brain_active: true, brain_thinking: true });
  const visible = () => notice.textContent === "Thinking…" && getComputedStyle(notice).visibility === "visible" && notice.getClientRects().length > 0;
  const check = (ok, message) => { if (!ok) throw new Error(message); };
  const tick = () => new Promise((resolve) => requestAnimationFrame(resolve));

  try {
    await tick();
    check(!visible(), "No notice before a live request");
    const originalTop = input.getBoundingClientRect().top;
    thinking();
    check(visible() && notice.textContent === "Thinking…", "Show before thought text arrives");
    check(input.getBoundingClientRect().top === originalTop, "No composer jump on start");
    check(!notice.querySelector("button"), "The notice has no action");

    input.focus();
    input.value = "What can you see?";
    input.dispatchEvent(new Event("input"));
    check(visible() && document.activeElement === input, "Typing keeps the notice and focus");
    input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
    await tick();
    check(published.some(({ topic }) => topic === CHAT_IN_TOPIC), "Sending still works while thinking");
    check(visible(), "Sending does not clear a live request");

    for (let i = 0; i < 30; i++) {
      topics.get(CHAT_OUT_TOPIC)({ data: JSON.stringify({ sender: "robot", text: `Earlier message ${i}`, timestamp: i + 1 }) });
    }
    await tick();
    stream.scrollTop = 0;
    stream.dispatchEvent(new Event("scroll"));
    await tick();
    const inputTop = input.getBoundingClientRect().top;
    thinking();
    await tick();
    check(stream.scrollTop === 0 && visible(), "Scrollback keeps the live notice in place");
    check(input.getBoundingClientRect().top === inputTop, "Heartbeats do not move the composer");

    sendStatus({ brain_active: true, brain_thinking: false });
    check(!visible(), "Completion clears the notice");
    check(input.getBoundingClientRect().top === inputTop, "No composer jump on completion");
    thinking();
    sendStatus({ brain_active: false, brain_thinking: true });
    check(!visible(), "Deactivation wins over an in-flight request");
    thinking();
    sendStatus({ brain_active: true });
    check(!visible(), "Older robots without the new field stay quiet");
    thinking();
    for (const cb of connections) cb("disconnected");
    check(!visible(), "Disconnect clears the notice");
    for (const cb of connections) cb("connected");
    check(!visible(), "Reconnect waits for fresh status");
    thinking();
    await new Promise((resolve) => setTimeout(resolve, 10_100));
    check(!visible(), "A vanished brain cannot leave the notice stuck");

    // Leave the real panel showing the proposed state for visual inspection.
    thinking();
    window.fixture = { panel, thinking, topics, connections };
    document.title = "PASS — Thinking notice";
    document.querySelector("#result").textContent = "PASS — thinking, typing, sending, scrollback, completion, disconnect, compatibility and stale status";
  } catch (error) {
    document.title = "FAIL — Thinking notice";
    document.querySelector("#result").textContent = `FAIL — ${error.message}`;
    console.error(error);
  }
</script>
</html>
