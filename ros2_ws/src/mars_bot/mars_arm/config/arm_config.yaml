/mars_arm:
  ros__parameters:
    # Device detection automatic - looks for 7 servos at 1M baud
    baud_rate: 1000000
    control_frequency: 200.0
    trajectory_rate_hz: 100.0
    max_jerk: 150.0  # rad/s³ jerk limit for trajectories (0 = disabled)

    # =============================================================
    # Joint Configuration for Mars Arm (nav2-style)
    # =============================================================
    # List of joints, then each joint's parameters as a sub-map.
    #
    # ── Gravity compensation ──────────────────────────────────────
    # The arm's holding torque is computed from mars.urdf and turned into a
    # goal-position offset — each joint is commanded exactly as far past its
    # target as its own P term needs to carry the load (see arm_types.hpp).
    # It is purely additive: gains, including ki, are whatever this file says.
    #
    # OFF by default, because it loses to the integral gains. Measured over the
    # same nine held poses (/debug/arm-tracking.html), gripper error was 6.5mm
    # with ki and no compensation, 16.5mm with compensation and ki=0, and 44mm
    # with neither. The arm's steady-state error is dominated by a 3-6 degree
    # friction band per joint, not by gravity: an integral term winds up until
    # the joint breaks free, and a feedforward cannot see friction at all.
    # Joint 1 is the proof — no gravity torque on it whatsoever, 1.3 degrees of
    # error without ki and 0.28 with it. See README.md.
    #
    # `enabled` is live (Settings > Safety & hardware > Arm, or
    # `ros2 param set /mars_arm gravity_compensation.enabled true`), so it can
    # be switched against a held pose. full_pwm_torque_nm per joint is the
    # trim; the fitted values are in README.md.
    gravity_compensation:
      enabled: false
      # Blowup guard, not a working limit: the softest gains at full reach
      # legitimately need ~0.11 rad, so anything past this is a broken model.
      max_offset_rad: 0.25

    # Gains arrays: [kp, ki, kd, ff1, ff2]  (range 0–16383 each)
    #   gains_near = PID+FF gains when arm is retracted (low gravity torque)
    #   gains_far  = PID+FF gains when arm is extended  (high gravity torque)
    #   If gains_far is omitted, far = near → gain scheduling is a no-op.
    #
    # Gain scheduling always runs. It interpolates between near and far
    # based on end-effector extension. If near == far, no servo writes occur.
    #
    # Profile (0 = unlimited):
    #   profile_velocity     = max velocity (rev/min units)
    #   profile_acceleration = max acceleration (rev/min² units)
    #
    # ── Servo Hardware Reference ──────────────────────────────────
    # Motor          | Voltage     | Gears   | Current Modes 0,5 | Addr 126
    # XL330-M288     | 3.7-6V (5V) | Plastic | ✅ (max 1750mA)   | Current (mA)
    # XC330-M288     | 3.7-6V (5V) | Metal   | ✅ (max 1750mA)   | Current (mA)
    # XL430-W250     | 6.5-12V     | Plastic | ❌ No              | Load (0.1%)
    # XC430-W150/T240| 6.5-14.8V   | Metal   | ❌ No              | Load (0.1%)
    # ──────────────────────────────────────────────────────────────
    # Edit gains_near / gains_far below and save.
    # If pid_hot_reload.py is running, changes apply INSTANTLY via
    #   ros2 param load /mars_arm <this file>
    # =============================================================

    joints: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6", "joint_7"]

    joint_1:
      servo_id: 1
      motor_type: "XL430-W250"
      full_pwm_torque_nm: 1.5   # XL430-W250 @ 12V, datasheet stall torque
      position_limits: [-1.5708, 1.5708]
      pwm_limit: 885
      control_mode: 3
      profile_velocity: 250
      profile_acceleration: 120
      gains_near: [730, 0, 0, 100, 0]    # [kp, ki, kd, ff1, ff2]
      gains_far: [100, 0, 100, 50, 0]    # [kp, ki, kd, ff1, ff2]
      gains_teleop: [300, 10, 1000, 0, 0] # November teleop gains

    joint_2:
      servo_id: 2
      motor_type: "XC430-W150"
      full_pwm_torque_nm: 1.5   # XC430-W150 @ 12V, datasheet stall torque
      position_limits: [-1.5708, 1.22]
      pwm_limit: 885
      control_mode: 3
      profile_velocity: 150
      profile_acceleration: 50
      gains_near: [1500, 0, 2000, 0, 0]
      gains_far: [6000, 0, 12000, 0, 0]
      gains_teleop: [300, 200, 100, 0, 0] # November teleop gains

    joint_3:
      servo_id: 3
      motor_type: "XL430-W250"
      full_pwm_torque_nm: 1.5   # XL430-W250 @ 12V, datasheet stall torque
      position_limits: [-1.5708, 1.7453]
      pwm_limit: 885
      control_mode: 3
      profile_velocity: 200
      profile_acceleration: 50
      gains_near: [1500, 0, 2000, 1701, 0]
      gains_far: [8000, 0, 12000, 1701, 0]
      gains_teleop: [640, 100, 3600, 0, 0] # November teleop gains

    joint_4:
      servo_id: 4
      motor_type: "XC330-M288"
      full_pwm_torque_nm: 0.93   # XC330-M288 @ 5V, datasheet stall torque
      position_limits: [-1.9199, 1.7453]
      pwm_limit: 885
      control_mode: 3
      profile_velocity: 100
      profile_acceleration: 50 
      gains_near: [800, 500, 3000, 0, 0]
      gains_far: [1800, 1000, 12000, 0, 0]
      gains_teleop: [400, 400, 1000, 0, 0] # November teleop gains

    joint_5:
      servo_id: 5
      motor_type: "XC330-M288"
      full_pwm_torque_nm: 0.93   # XC330-M288 @ 5V, datasheet stall torque
      position_limits: [-1.5708, 1.5708]
      pwm_limit: 885
      control_mode: 3
      profile_velocity: 100
      profile_acceleration: 50
      gains_near: [2900, 0, 0, 0, 0]
      gains_teleop: [400, 0, 0, 0, 0]     # November teleop gains

    joint_6:
      servo_id: 6
      motor_type: "XC330-M288"
      position_limits: [-0.8727, 0.3491]
      pwm_limit: 885
      # Mode 5 = current-based position control: the gripper drives toward its
      # goal position with output capped at goal_current, so a deep close
      # squeezes any object at constant safe force — no overload trips, no
      # software force loops.
      #
      # goal_current is the REAL torque cap (RAM addr 102). current_limit
      # (EEPROM addr 38) only bounds what goal_current may be and sets the
      # overload-detection threshold, so it must stay comfortably ABOVE the
      # grip current or the servo trips overload while gripping — that is what
      # the old current_limit: 100 did in mode 4, where nothing capped output
      # and a grip drew 1724 mA against a 100 mA trip threshold.
      #
      # 700 mA: the metal-robot pick that gripped well ran ~930-1110 mA before
      # tripping, and the health warning fires at 800, so this grips firmly
      # with headroom. Raised from 600 after a rigid figurine slipped out
      # during the verify backup (2026-07-23); 800 is the ceiling here.
      current_limit: 1300
      goal_current: 700
      control_mode: 5
      # Close gently — the current cap means it presses in rather than impacts.
      profile_velocity: 60
      profile_acceleration: 30
      gains_near: [400, 0, 0, 0, 0]
      gains_teleop: [400, 0, 0, 0, 0]     # November teleop gains

    joint_7:
      servo_id: 7
      motor_type: "XC330-M288"
      full_pwm_torque_nm: 0.93   # XC330-M288 @ 5V, datasheet stall torque
      position_limits: [-0.4363, 0.4363]
      pwm_limit: 885
      current_limit: 500
      control_mode: 3
      homing_offset: 341
      gains_near: [400, 1011, 0, 0, 0]
      head_config:
        ai_position_deg: -20.0
        direction_reversed: true
