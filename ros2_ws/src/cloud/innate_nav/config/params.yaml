innate_nav_node:
  ros__parameters:
    # The policy runs on a server, never on the robot. https:// here upgrades
    # the stream to wss:// on its own.
    server_url: "http://192.168.0.156:8900"
    # Empty = the server requires no token. INNATE_NAV_SERVER_TOKEN overrides.
    server_token: ""
    # The same physical sensor as main_camera/left, re-projected to the 110-deg
    # view the policy trained on. left/image_raw is 84.5 deg -- a 1.57x longer
    # focal length, which the model reads as floor distances ~36% nearer.
    camera_topic: "/mars/main_camera/left/wide/image_rect/compressed"
    # r2r/rxr take free-form English; objectnav and pointnav are templated
    # server-side. Also selects the history window mode.
    task_family: "r2r"
    # One of the discrete budgets training randomized over (2048/3072/4096).
    token_budget: 3072
    max_linear_speed: 0.4
    max_angular_speed: 1.0
    publish_path: true
    # Clip and nudge the policy's path with Nav2's local costmap (/scan only --
    # the depth STVL layer is disabled -- inflated against the live footprint).
    # The policy plans for the 0.1 m-radius agent it was trained on, so its line
    # shaves corners this body cannot take. false = plain pursuit, no clearance.
    use_costmap: true
    camera_info_topic: "/mars/main_camera/left/wide/camera_info"
    # 110 deg over 640px -- what the checkpoint was trained at. Startup
    # compares the camera's advertised K against this and says so if it differs.
    expected_fx: 224.07

wide_view:
  ros__parameters:
    # image_raw, NOT image_rect: the stereo pipeline rectifies with alpha=0
    # (crop to pixels valid in both cameras), which is right for depth but
    # leaves ~100 deg where the policy needs 110. Undistorting the raw image
    # ourselves is monocular and leaves that pipeline alone.
    source_topic: "/mars/main_camera/left/image_raw/compressed"
    source_info_topic: "/mars/main_camera/left/camera_info"
    output_topic: "/mars/main_camera/left/wide/image_rect/compressed"
    # false pins the nominal lens even on a calibrated robot (A/B only).
    use_camera_info: true
    # Fixed by the checkpoint, identical on every robot: the policy reads
    # metric distance out of pixels and cannot absorb per-unit variation.
    hfov_deg: 110.0
    width: 640
    # 370, not the 480 training rendered: 4:3 at 110 deg wants 93.9 deg
    # vertically and the sensor has ~82. The rows dropped are the nearest
    # ~7 cm of floor. The training crop must match whatever this is.
    height: 370
    jpeg_quality: 80
