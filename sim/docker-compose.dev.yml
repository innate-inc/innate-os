name: innate-os

services:
  # Optional X display for GUI debugging inside the container; the sim runs
  # headless and never draws to it. Start it with COMPOSE_PROFILES=x11.
  novnc:
    image: theasp/novnc:latest
    profiles: ["x11"]
    environment:
      # Adjust to your desired screen resolution:
      - DISPLAY_WIDTH=1600
      - DISPLAY_HEIGHT=968
      - RUN_XTERM=no
    ports:
      # novnc's browser view of the container X display (optional; the sim
      # renders headless). Override the published side when 8080 is taken:
      # NOVNC_PORT=8081 ./innate-sim up.
      - "${NOVNC_PORT:-8080}:8080"
    networks:
      - x11

  innate:
    image: ${INNATE_OS_IMAGE:-innate-os-sim-clean-innate:latest}
    build:
      context: ..
      dockerfile: sim/Dockerfile
      target: dev-runtime
      # Build with the host network namespace so `RUN apt-get` can reach DNS.
      # On hosts using systemd-resolved (nameserver 127.0.0.53) the default
      # bridge build network can't reach that host-loopback resolver, so apt
      # fails with "Temporary failure resolving ...". Harmless where bridge
      # DNS already works.
      network: host
    container_name: innate-dev
    # Use host networking if you need direct access to hardware, or use your own approach
    environment:
      # Points at the optional novnc X display (COMPOSE_PROFILES=x11);
      # harmless when that profile is off -- the sim renders headless.
      - DISPLAY=novnc:0.0
      - VIRTUAL_MARS_ASSETS=/root/innate-os/sim/assets
      - INNATE_OS_ROOT=/root/innate-os
      - SKIP_UPDATE_CHECK=1 # Skip git update checks in simulation mode
      - CCACHE_DIR=/root/.cache/ccache
      # Zenoh SHM needs realtime thread priorities Docker won't grant; without
      # them it stalls service/action traffic under load (see setup_dds.zsh).
      - INNATE_ZENOH_DISABLE_SHM=1
      # Set by the launcher when the host world server runs (native GL
      # rendering outside Docker, see mars_sim_driver/world_server.py);
      # required -- the sim world always runs outside the container.
      - VIRTUAL_MARS_REMOTE=${VIRTUAL_MARS_REMOTE:-}
      # The Foxglove bridge's published host port, so in-container tooling
      # (innate foxglove status) can print the address that actually works
      # from the host. Must match the ports entry below.
      - SIM_FOXGLOVE_PORT=${SIM_FOXGLOVE_PORT:-8765}
      # Brain ("agent") websocket the robot connects to. With
      # COMPOSE_PROFILES=local-brain the in-compose cloud-agent service starts and
      # the brain client is pointed at it over the shared x11 network. With no
      # profile this resolves empty and the brain client just idles (no brain);
      # set BRAIN_WEBSOCKET_URI explicitly to pin a hosted/remote agent. The
      # launcher (`./innate-sim up`) overlays its own value via the mounted .env,
      # which wins — so this default only affects raw `docker compose` runs.
      - BRAIN_WEBSOCKET_URI=${BRAIN_WEBSOCKET_URI:-${COMPOSE_PROFILES:+ws://cloud-agent:8765}}
    ports:
      # rosbridge (rws). Loopback by default: publishing on 0.0.0.0 invites
      # internet probes that open, send nothing, and disconnect, spamming the
      # rws log. Set SIM_ROSBRIDGE_BIND=0.0.0.0 to let LAN devices (e.g. a
      # phone/laptop opening the sim viewer) reach it.
      - "${SIM_ROSBRIDGE_BIND:-127.0.0.1}:9090:9090"
      # webapp front door (replaces the deprecated sim/frontend UI): the in-container
      # python server binds 443 (https) + 80 (http), both serving the full app.
      # Override the published side (e.g. SIM_HTTPS_PORT=8443 ./innate-sim up) to
      # publish on a non-privileged port; the container always binds 443/80.
      - "${SIM_HTTPS_PORT:-443}:443"
      - "${SIM_HTTP_PORT:-80}:80"
      # Foxglove bridge websocket (auto-started by launch_sim_in_tmux.zsh).
      # Loopback by default, like rosbridge; SIM_FOXGLOVE_BIND=0.0.0.0 opens it
      # to the LAN. The launcher publishes 8766 instead when the local brain is
      # active (cloud-agent owns host 8765) — set SIM_FOXGLOVE_PORT yourself for
      # raw `docker compose --profile local-brain` runs.
      - "${SIM_FOXGLOVE_BIND:-127.0.0.1}:${SIM_FOXGLOVE_PORT:-8765}:8765"

    volumes:
      # 1) Mount your local code (paths are relative to this file's directory)
      - ../ros2_ws:/root/innate-os/ros2_ws:rw
      - ../scripts:/root/innate-os/scripts:rw
      - ../config:/root/innate-os/config:ro
      - ../workspace:/root/innate-os/workspace:rw
      - ../webapp:/root/innate-os/webapp:ro
      # Apartment assets for the sim driver (generated by sim/tools; the
      # driver package reads VIRTUAL_MARS_ASSETS).
      - ../sim/assets:/root/innate-os/sim/assets:ro
      # The viewer's public assets (apartment glb, robot meshes) the webapp
      # serves at /models /robot /physics for the SimSession.
      - ../sim/viewer/public:/root/innate-os/sim/viewer/public:ro
      # The SimSession bundle the webapp serves at /sim-viewer/ (built on the
      # host with `npm run build:lib` in sim/viewer).
      - ../sim/viewer/dist-lib:/root/innate-os/sim/viewer/dist-lib:ro
      - ${INNATE_OS_ENV_FILE:-../.env}:/root/innate-os/.env:ro

      # 2) Keep build/install/log folders as Docker named volumes, so they won't pollute your host
      - ros2_ws_build:/root/innate-os/ros2_ws/build
      - ros2_ws_install:/root/innate-os/ros2_ws/install
      - ros2_ws_log:/root/innate-os/ros2_ws/log
      - ccache:/root/.cache/ccache

      # Persist ROS runtime node logs (~/.ros/log) to the host so per-node
      # stdout/stderr survives `docker compose down` on a failed startup.
      - ./launcher/.state/ros-log:/root/.ros/log

      # Persist the webapp's self-signed TLS cert across `down`/`up` so the
      # browser only has to accept the HTTPS warning once (otherwise the cert
      # lives in the container's ephemeral layer and is regenerated each up).
      - ./launcher/.state/webapp-tls:/root/.innate-webapp-tls

      # 3) Mount git credentials from host (read-only for security)
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro

    # 2) Or just do a "do-nothing" command so the container doesn't exit
    command: zsh -l

    # 3) Keep container open for interactive usage
    tty: true
    stdin_open: true
    shm_size: "2g"
    # rmw_zenoh mlock()s its POSIX SHM pool. The container's default 64 KiB
    # memlock ceiling makes the receive-side mmap fail with ENOMEM ("OS error
    # 12"), silently dropping SHM back to TCP. Lift the lock limit so the SHM
    # transport actually works. (shm_size only sizes /dev/shm, not the lock.)
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - x11
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Local "brain" for the robot. Only started when the local-brain profile is
  # active, e.g.:
  #   COMPOSE_PROFILES=local-brain docker compose -f sim/docker-compose.dev.yml up
  # The innate container's BRAIN_WEBSOCKET_URI then points here (ws://cloud-agent:8765)
  # over the shared x11 network. Reads GEMINI_API_KEY from the same .env the innate
  # container uses. The source repo lives OUTSIDE this repo (cloned by `./innate-sim
  # setup`); INNATE_CLOUD_AGENT_DIR overrides the location (the launcher sets it).
  cloud-agent:
    profiles: ["local-brain"]
    image: ${INNATE_CLOUD_AGENT_IMAGE:-innate-os-cloud-agent:latest}
    build:
      context: ${INNATE_CLOUD_AGENT_DIR:-../../innate-cloud-agent}
      dockerfile: Dockerfile
      # Build on the host network namespace for DNS during `pip install`, matching
      # the innate service (systemd-resolved hosts can't resolve over bridge DNS).
      network: host
    container_name: innate-cloud-agent
    working_dir: /app
    env_file:
      # Same secrets file as the innate container — supplies GEMINI_API_KEY.
      - ${INNATE_OS_ENV_FILE:-../.env}
    environment:
      - PORT=8765
      # Robot model the brain configures itself for (camera FOV, thresholds, ...).
      - ROBOT_TYPE=${ROBOT_TYPE:-sim}
      # Local dev: bypass the hosted auth handshake. SKIP_AUTH needs these three set.
      - SKIP_AUTH=true
      - DEFAULT_ROBOT_TOKEN=local-dev-robot-token
      - DEFAULT_USER_ID=local-dev-user
      - DEFAULT_SERVICE_KEY=local-dev-service-key
    volumes:
      # Live source for dev, mirroring the launcher's local-source mode.
      - ${INNATE_CLOUD_AGENT_DIR:-../../innate-cloud-agent}:/app
    command: python -u run_server.py
    ports:
      - "${SIM_CLOUD_AGENT_PORT:-8765}:8765"
    networks:
      - x11

volumes:
  ros2_ws_build:
  ros2_ws_install:
  ros2_ws_log:
  ccache:

networks:
  x11:
