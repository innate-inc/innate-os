[project]
name = "innate-sim"
version = "0.1.0"
description = "Native MuJoCo dev tooling for the innate sim: asset pipeline (tools/) and physics sandboxes (sandbox/)"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.2",
    "numpy>=1.26",
    "trimesh>=4.0",
    "coacd>=1.0.5",
    "websockets>=12.0",
    "pillow>=12.3.0",
]

[dependency-groups]
# For sandbox/virtual_mars_demo.ipynb: `uv sync --group notebook`.
notebook = [
    "matplotlib>=3.8",
    "ipykernel>=6.29",
]
# For benchmarks/spatial_memory: `uv sync --group benchmark`. httpx is what
# brain_client's Gemini transport uses, opencv what its coverage paint uses --
# the benchmark runs the production retrieval code, not a reimplementation.
benchmark = [
    "httpx>=0.27",
    "opencv-python-headless>=4.9",
]

[tool.uv]
package = false
