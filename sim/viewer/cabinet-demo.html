<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kitchen cabinet · MARS simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#c4c0b8;font-family:system-ui,sans-serif;color:#292724}canvas{display:block}header{position:absolute;top:24px;left:24px;pointer-events:none;background:#faf8f1eb;padding:16px 20px;border-radius:12px;box-shadow:0 3px 24px #0001}h1{font-size:18px;font-weight:550;margin:0 0 6px}p{font-size:12px;margin:0;color:#68625b}footer{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#faf8f1f2;padding:10px;border-radius:14px;box-shadow:0 3px 24px #0002;white-space:nowrap}button{border:0;border-radius:8px;padding:11px 16px;background:#e9e5dc;color:#292724;cursor:pointer;font:500 13px system-ui}button:hover{background:#dcd6ca}button:first-child{background:#353d33;color:#fff}output{font-size:13px;font-variant-numeric:tabular-nums;min-width:50px;text-align:center}@media(max-width:600px){header{top:12px;left:12px;right:12px}footer{bottom:12px}button{padding:10px}}
</style></head><body><header><h1>Kitchen cabinet</h1><p id="status">Loading the original kitchen and physics replay…</p></header><footer><button id="open">Open door</button><button id="close">Close door</button><button id="replay">Replay</button><output id="angle">0°</output></footer>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {KitchenCabinet} from './src/cabinet.ts';
const scene=new T.Scene();scene.background=new T.Color('#c4c0b8');
const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.01,100);
camera.position.set(-.8,1.1,2.05);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-1.5,.45,.52);controls.enableDamping=true;
scene.add(new T.AmbientLight(0xffffff,1.2));const sun=new T.DirectionalLight(0xffffff,1.8);sun.position.set(-2,5,3);scene.add(sun);
const cabinet=new KitchenCabinet();
let frames=[],time=0,playing=false,end=10,loop=false;
const status=document.querySelector('#status'),angle=document.querySelector('#angle');
try{
 const [gltf,replay]=await Promise.all([new GLTFLoader().loadAsync('/models/apartment/04_Sala_Cozinha.glb'),fetch('/cabinet-replay.json').then(r=>{if(!r.ok)throw Error('Run sim/sandbox/cabinet_demo.py --record first.');return r.json()})]);
 cabinet.install(gltf.scene);scene.add(gltf.scene);frames=replay.frames;playing=true;
 status.textContent='Original kitchen finish · handle at 30 cm · MuJoCo hinge replay';
}catch(e){status.textContent=String(e)}
function play(start,stop,repeat=false){time=start;end=stop;playing=true;loop=repeat}
function continueTo(open){
 if(!frames.length)return;
 const current=frames[Math.min(frames.length-1,Math.floor(time*60))].angle;
 const start=open?60:360,stop=open?348:599;
 let nearest=start;
 for(let i=start;i<=stop;i++)if(Math.abs(frames[i].angle-current)<Math.abs(frames[nearest].angle-current))nearest=i;
 play(nearest/60,stop/60);
}
document.querySelector('#open').onclick=()=>continueTo(true);
document.querySelector('#close').onclick=()=>continueTo(false);
document.querySelector('#replay').onclick=()=>play(0,9.98,true);
let previous=performance.now();
renderer.setAnimationLoop(now=>{
 const dt=Math.max(0,Math.min((now-previous)/1000,.1));previous=now;
 if(frames.length){
  if(playing){time+=dt;if(time>=end){if(loop)time=0;else{time=end;playing=false}}}
  const f=frames[Math.min(frames.length-1,Math.floor(time*60))];cabinet.setPose(f.objects);
  angle.textContent=Math.round(T.MathUtils.radToDeg(f.angle))+'°';
 }
 controls.update();renderer.render(scene,camera);
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
